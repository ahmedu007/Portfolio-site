name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public directory
        run: |
          mkdir -p public/.well-known
          cp index.html styles.css script.js favicon.svg favicon.ico robots.txt sitemap.xml llms.txt ai-catalog.json og-image.png public/ 2>/dev/null || true
          cp -r .well-known/* public/.well-known/ 2>/dev/null || true
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UMAIR_DEV_SITE }}
          projectId: umair-dev-site
