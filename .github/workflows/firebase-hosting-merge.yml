# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public directory
        run: |
          mkdir -p public/.well-known
          cp index.html styles.css script.js favicon.svg favicon.ico robots.txt sitemap.xml llms.txt ai-catalog.json public/ 2>/dev/null || true
          cp -r .well-known/* public/.well-known/ 2>/dev/null || true
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UMAIR_DEV_SITE }}
          channelId: live
          projectId: umair-dev-site
