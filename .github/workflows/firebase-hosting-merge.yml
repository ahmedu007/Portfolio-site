name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare public directory
        run: |
          mkdir -p public
          cp index.html styles.css script.js favicon.svg favicon.ico public/
      - name: Deploy to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UMAIR_DEV_SITE }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "ERROR: Secret FIREBASE_SERVICE_ACCOUNT_UMAIR_DEV_SITE is missing or empty!"
            exit 1
          fi
          echo "$SERVICE_ACCOUNT" > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
          npx firebase-tools deploy --only hosting --project umair-dev-site --debug
